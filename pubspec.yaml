name: ez_save
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: "^3.10.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3

  # Social Sign-In
  google_sign_in: ^7.2.0
